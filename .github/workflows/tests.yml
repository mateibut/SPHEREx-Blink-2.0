# Runs the automatic tests on every push and pull request: the browser-side modules (Node, no install), the backend (pytest) and a
# smoke test of the page in a headless browser. None of them needs real SPHEREx data or the network: the backend tests make synthetic FITS files on the fly, and the Node tests use
# synthetic fields and tiny invented maps. (The real-data scripts in scratch/ need the local cutouts and are NOT run here.)
#
# Action versions are the ones pages.yml already uses plus setup-node / setup-python v4 / v5, written from memory; they worked in the
# runs of 8-10 Nov 2026 (Python 3.14 included), but the logs warn that some of them target Node.js 20, which is deprecated (GitHub runs
# them on Node 24 for now). Newer major versions were not looked up: if a run says a version does not exist, change it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Browser-side modules (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run every scratch/test_*.mjs
        run: |
          status=0
          for f in scratch/test_*.mjs; do
            echo "::group::$f"
            node "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  # A smoke test of the whole page in a real browser (headless Chrome over the DevTools Protocol, Node only, no npm): scratch/e2e_smoke.mjs serves
  # frontend/ itself and uses the SYNTHETIC demo, so it needs neither the backend nor the network. It needs Node 22+ (the built-in WebSocket) and a Chrome
  # or Edge: the ubuntu-latest image had one that the test found with no extra step (run 42711017130, 10 Nov 2026: 12 of 12 with Node 22.23.4). If a
  # later image has none, the run says "SKIP no Chrome or Edge found" and the job fails on purpose (exit 2): install Chrome in an extra step or set CHROME_PATH.
  e2e:
    name: Page smoke test (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Walk the main path in the browser
        run: node scratch/e2e_smoke.mjs

  # The keyboard and screen-reader audit (scratch/a11y_audit.mjs): real Tab and key presses in headless Chrome on the synthetic demo, names, focus indicators, live announcements. Same needs
  # as the e2e job (Node 22+, the runner's Chrome). It checks what a screen reader would be given; it does not replace listening with one.
  a11y:
    name: Keyboard and screen-reader audit (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit the page with the keyboard
        run: node scratch/a11y_audit.mjs

  release:
    name: Zoom, forced colours, reduced motion, touch (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release-quality checks
        run: node scratch/release_audit.mjs

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend -q
